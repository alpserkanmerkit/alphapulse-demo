# Single CI: ubuntu-latest (adapted from the project template). Jobs run in parallel; critical path = the slowest single job.
# The language blocks are fixed in this repo, so the template's "detect" job was removed (~10 s off the critical path).
#
# AJAN-4 changes (measured results in docs/test-temel/ajan4-ci.md):
#  - smoke: uses the preinstalled Google Chrome (present on the ubuntu-latest image) -> `playwright install` + browser cache removed.
#    Source: https://playwright.dev/docs/ci ("Caching browser binaries is not recommended" - restoring takes as long as downloading)
#    and https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md (Browsers and Drivers: Google Chrome).
#  - node-static split into two parallel jobs (lint || typecheck+build); lint does not need the Prisma client.
#  - python: pytest instead of unittest (also runs unittest TestCases; 0 tests = exit code 5 = red) + coverage.py coverage artifact.
#  - the new BASELINE security layer runs as SEPARATE parallel jobs (not added to the critical path): python-lint-sec (ruff + bandit), security-deps (OSV-Scanner).
#  - existing action versions (checkout/setup-node/setup-python @v7, cache@v4 removed) unchanged; newly added: actions/upload-artifact@v7
#    (latest release v7.0.2, verified via https://github.com/actions/upload-artifact/releases/latest).
name: CI

on:
  push:
    branches: [main, 'codex/**', 'gece/**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GL_VERSION: 8.30.1
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o sums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_checksums.txt"
          grep linux_x64.tar.gz sums.txt | sed 's/ .*/  gl.tgz/' | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner -v --log-opts="HEAD" .

  # JS/TS gates are parallel jobs: lint || typecheck+build || unit (same steps, only split).
  node-lint:
    name: JS/TS lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # eslint.config.js uses no type-aware rules -> prisma generate is not needed.
      - run: npm run lint

  node-static:
    name: JS/TS typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run build

  node-unit:
    name: JS/TS unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run test:unit

  # Smoke no longer waits for the node job: both run in parallel.
  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Pre-warm the Chrome binary in the background (overlaps with npm ci, not added to the critical path): on some runners the first launch
      # reads cold from disk and takes 10-16 s (smoke 84-88 s; runs 37671732662, 37674075209). Experiment (run 37674378961,
      # 5 samples each): without pre-warm 1/5 slow (81 s job), with pre-warm 0/5 slow (worst 46 s).
      - name: Chrome pre-warm (background)
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            nohup sh -c 'google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom about:blank >/dev/null 2>&1' >/dev/null 2>&1 &
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # No db:generate: smoke only starts the Vite dev server; the frontend does not import @prisma/client.
      - name: Is preinstalled Chrome available
        id: chrome
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "path=$(command -v google-chrome)" >> "$GITHUB_OUTPUT"
            google-chrome --version
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi
      # Fallback: if no preinstalled Chrome, use Playwright's own Chromium (no cache: playwright.dev/docs/ci advises against it).
      - name: Playwright Chromium (if no Chrome)
        if: steps.chrome.outputs.path == ''
        run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
        env:
          CI: true
          # playwright.config.ts reads this variable; if empty, Playwright's own Chromium is used.
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
      - name: Playwright traces (on failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        # The repo's artifact storage quota may be full ("Artifact storage quota has been hit", run 37671732662):
        # the artifact is auxiliary output, so the quota must not turn the job red. The main content is also in the job summary (GITHUB_STEP_SUMMARY).
        continue-on-error: true
        with:
          name: playwright-test-results
          path: output/playwright/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Demo smoke test: `npm run demo` (server in demo mode + Vite) is actually started; API + UI are verified with Playwright.
  # Independent of the other jobs, runs in parallel. Uses the same preinstalled Chrome path as smoke.
  demo-smoke:
    name: Demo smoke (npm run demo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Is preinstalled Chrome available
        id: chrome
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "path=$(command -v google-chrome)" >> "$GITHUB_OUTPUT"
            google-chrome --version
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi
      - name: Playwright Chromium (if no Chrome)
        if: steps.chrome.outputs.path == ''
        run: npx playwright install --with-deps chromium
      - run: npm run test:demo
        env:
          CI: true
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
      - name: Playwright traces (on failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: demo-playwright-test-results
          path: output/playwright/test-results
          retention-days: 7
          if-no-files-found: ignore

  python:
    name: Quant Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quant-engine/requirements.txt
      # Test tools are kept out of requirements.txt (runtime dependencies); versions are pinned.
      # httpx: required by the FastAPI TestClient (without it 3 of the main.py handler tests are SKIPPED; see docs/test-temel/ajan3-quant.md).
      - run: python -m pip install -r quant-engine/requirements.txt pytest==9.1.1 coverage==7.16.2 httpx==0.27.2
      - run: python -m py_compile quant-engine/main.py quant-engine/market_data.py quant-engine/models/stochastic.py quant-engine/models/econometrics.py quant-engine/models/value.py
      # pytest + coverage.py run FROM INSIDE quant-engine/: configuration is read from quant-engine/pyproject.toml (AJAN-3)
      # (testpaths, pythonpath, branch coverage, fail_under). coverage reads its configuration from the working directory:
      # https://coverage.readthedocs.io/en/latest/config.html . If 0 tests are collected, pytest exits with code 5 -> red (no false green);
      # unittest.TestCases run as well.
      - name: pytest + coverage
        working-directory: quant-engine
        run: python -m coverage run -m pytest -v
      # COVERAGE GATE: [tool.coverage.report] fail_under in pyproject (exit code 2) turns this step red.
      - name: Coverage report
        if: ${{ !cancelled() }}
        working-directory: quant-engine
        run: |
          rc=0
          python -m coverage report > ../coverage.txt || rc=$?
          python -m coverage xml -o ../coverage.xml
          cat ../coverage.txt
          { echo '### Quant coverage'; echo '```'; cat ../coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        # The repo's artifact storage quota may be full ("Artifact storage quota has been hit", run 37671732662):
        # the artifact is auxiliary output, so the quota must not turn the job red. The main content is also in the job summary (GITHUB_STEP_SUMMARY).
        continue-on-error: true
        with:
          name: quant-coverage
          path: |
            coverage.xml
            coverage.txt
          retention-days: 14
          if-no-files-found: ignore

  # --- BASELINE security/style layer: SEPARATE parallel jobs, does not lengthen the critical path ---

  # ruff (lint) + bandit (SAST) - quant-engine Python code only.
  python-lint-sec:
    name: Python lint + SAST (ruff, bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quant-engine/requirements.txt
      - run: python -m pip install ruff==0.16.8 bandit==1.9.4
      # ruff: https://docs.astral.sh/ruff/linter/ (exit: 0 clean, 1 violations, 2 configuration/internal error).
      # DEPENDENCY: quant-engine/pyproject.toml is created by AJAN-3. If the file exists, ruff uses it and it is a HARD GATE;
      # without it, ruff runs with default rules for information only (never red). Once Ajan3 commits the pyproject,
      # this step becomes a hard gate automatically (no YAML change needed).
      - name: ruff check
        run: |
          if [ -f quant-engine/pyproject.toml ]; then
            echo "quant-engine/pyproject.toml found -> ruff hard gate"
            ruff check --output-format=github quant-engine
          else
            echo "::notice title=ruff::quant-engine/pyproject.toml missing (ajan3 will create it); ruff in info mode, never red"
            ruff check --isolated --output-format=github quant-engine || true
          fi
      # bandit: https://bandit.readthedocs.io/en/latest/man/bandit.html (-x exclude, --severity-level, --exit-zero).
      # Tests excluded (assert = B101 noise). The report lists all levels; the GATE is HIGH severity only
      # (measured baseline: 0 HIGH, 2 MEDIUM, 3 LOW -> existing code green, a new HIGH finding turns it red).
      - name: bandit report (all levels)
        run: bandit -r quant-engine -x quant-engine/tests --exit-zero
      - name: bandit gate (HIGH)
        run: bandit -r quant-engine -x quant-engine/tests --severity-level high

  # Dependency vulnerability scan: OSV-Scanner (npm + PyPI in one tool). https://google.github.io/osv-scanner/usage/
  # Instead of the official reusable workflow, a version-pinned, sha256-verified binary is used (SARIF upload
  # requires security-events:write + GHAS; may not work in a private repo; also avoids adding third-party action surface).
  # npm audit is not added separately: OSV includes the GitHub Advisory DB (GHSA) and scans package-lock.json the same way.
  security-deps:
    name: Dependency scan (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # REPORT MODE: the current baseline contains many known vulnerabilities (measured: 127, see docs/test-temel/ajan4-ci.md);
      # to avoid red CI, findings = ::warning. Set to 'true' once triage is done -> findings turn the job red.
      SECURITY_GATE: 'false'
      OSV_VERSION: 2.6.0
    steps:
      - uses: actions/checkout@v7
      - name: Install osv-scanner (sha256-verified)
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          curl -sSfL -o osv-sums.txt "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' osv-sums.txt | sed 's/ .*/  osv-scanner/' | sha256sum -c -
          chmod +x osv-scanner
      - name: Scan
        run: |
          rc=0
          ./osv-scanner scan source \
            -L package-lock.json \
            -L requirements.txt:quant-engine/requirements.txt \
            --format table --output-file osv.txt || rc=$?
          cat osv.txt
          { echo '### OSV-Scanner'; echo '```'; head -c 100000 osv.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # exit code: 0 clean, 1 vulnerabilities found, anything else tool/network error (always red).
          if [ "$rc" = 1 ]; then
            if [ "$SECURITY_GATE" = 'true' ]; then
              echo "::error title=OSV::known vulnerabilities found (SECURITY_GATE=true)"; exit 1
            fi
            echo "::warning title=OSV::known vulnerabilities found (report mode; set SECURITY_GATE=true to gate). Details: job summary (GITHUB_STEP_SUMMARY) and job log"
            exit 0
          fi
          exit "$rc"
      - name: OSV report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        # The repo's artifact storage quota may be full ("Artifact storage quota has been hit", run 37671732662):
        # the artifact is auxiliary output, so the quota must not turn the job red. The main content is also in the job summary (GITHUB_STEP_SUMMARY).
        continue-on-error: true
        with:
          name: osv-report
          path: osv.txt
          retention-days: 14
          if-no-files-found: ignore
